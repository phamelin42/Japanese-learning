<fd-dialog title="Oublier le code sur cet appareil ?">
  <p>
    La progression reste sur cet appareil, mais elle ne sera plus synchronisée tant que le code
    n’aura pas été saisi à nouveau.
  </p>
  <button slot="actions" fdButton variant="secondary" type="button" (click)="ref.close(false)">
    Garder le code
  </button>
  <button slot="actions" fdButton variant="danger" type="button" (click)="ref.close(true)">
    Oublier le code
  </button>
</fd-dialog>
